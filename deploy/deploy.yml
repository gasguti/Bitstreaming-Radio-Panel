---
# Playbook de despliegue: Bitstreaming Radio Panel
# =================================================
# Uso:
#   ansible-playbook -i inventory.yml deploy.yml
#
# Qué hace (en orden):
#   0. Verifica que los archivos necesarios existen (docker-compose.yml, azuracast.env, .env)
#   1. Backup completo de AzuraCast (base de datos + config)
#   2. Cambia la imagen Docker del fork en docker-compose.yml
#   3. ELIMINA el servicio `updater` (Watchtower) — evita que AzuraCast sobrescriba tu fork
#   4. Descarga la imagen nueva (docker compose pull)
#   5. Recrea el contenedor (docker compose up -d) — SIN tocar datos
#   6. Verifica que el panel responde
#
# Los datos (base de datos, música, config) viven en volumes Docker
# y NO se tocan en ningún momento.

- name: Desplegar Bitstreaming Radio Panel
  hosts: all
  gather_facts: yes
  become: yes
  vars:
    # Nombre del archivo de backup (con fecha)
    backup_name: "azuracast-backup-{{ ansible_date_time.date }}.zip"

  tasks:
    - name: "0a. Verificar que docker-compose.yml existe"
      ansible.builtin.stat:
        path: "{{ azuracast_dir }}/docker-compose.yml"
      register: compose_file

    - name: "0b. Abortar si falta docker-compose.yml"
      ansible.builtin.fail:
        msg: "No existe {{ azuracast_dir }}/docker-compose.yml. Revisa la ruta de instalación en inventory.local.yml (azuracast_dir)."
      when: not compose_file.stat.exists

    - name: "0c. Verificar que azuracast.env existe"
      ansible.builtin.stat:
        path: "{{ azuracast_dir }}/azuracast.env"
      register: app_env_file

    - name: "0d. Abortar si falta azuracast.env"
      ansible.builtin.fail:
        msg: "No existe {{ azuracast_dir }}/azuracast.env. NO lo borres ni lo reemplaces: contiene tu configuración real."
      when: not app_env_file.stat.exists

    - name: "1. Crear backup completo de AzuraCast"
      ansible.builtin.shell:
        cmd: |
          cd {{ azuracast_dir }}
          ./docker.sh backup /var/azuracast/backups/{{ backup_name }}
      register: backup_result
      changed_when: backup_result.rc == 0
      # Si el backup falla, abortamos TODO (no tocar nada sin respaldo)
      failed_when: backup_result.rc != 0

    - name: "2. Verificar que el backup existe en el host"
      ansible.builtin.stat:
        path: "/var/azuracast/backups/{{ backup_name }}"
      register: backup_file

    - name: "2b. Si no está en el host, verificar dentro del contenedor"
      ansible.builtin.command:
        cmd: "docker exec azuracast ls -la /var/azuracast/backups/{{ backup_name }}"
      register: backup_in_container
      changed_when: false
      failed_when: false
      when: not backup_file.stat.exists

    - name: "2c. Mover el backup del contenedor al host si hace falta"
      ansible.builtin.command:
        cmd: "docker cp azuracast:/var/azuracast/backups/{{ backup_name }} /var/azuracast/backups/{{ backup_name }}"
      changed_when: false
      when: not backup_file.stat.exists and backup_in_container.rc == 0

    - name: "3. Abortar si el backup no se creó (ni en host ni en contenedor)"
      ansible.builtin.fail:
        msg: "El backup no se creó. Abortando despliegue."
      when: not backup_file.stat.exists and backup_in_container.rc != 0

    - name: "4. Cambiar el repositorio de la imagen a tu fork (conservando el tag)"
      ansible.builtin.replace:
        path: "{{ azuracast_dir }}/docker-compose.yml"
        regexp: 'ghcr\.io/azuracast/azuracast'
        replace: '{{ image_name }}'
      register: compose_change

    - name: "4b. Verificar que la imagen quedó cambiada"
      ansible.builtin.command:
        cmd: "grep -q 'ghcr.io/azuracast/azuracast' docker-compose.yml && echo 1 || echo 0"
        chdir: "{{ azuracast_dir }}"
      register: image_check

    - name: "4c. Abortar si la imagen sigue siendo la de AzuraCast"
      ansible.builtin.fail:
        msg: "docker-compose.yml sigue apuntando a azuracast/azuracast. Revisa el archivo a mano."
      when: image_check.stdout | trim == "1"

    - name: "4d. Alinear AZURACAST_VERSION del .env con el tag de la imagen"
      ansible.builtin.replace:
        path: "{{ azuracast_dir }}/.env"
        regexp: '^(AZURACAST_VERSION=).*$'
        replace: 'AZURACAST_VERSION={{ image_tag }}'
      register: env_change

    - name: "4e. Verificar que AZURACAST_VERSION quedó alineado"
      ansible.builtin.command:
        cmd: "grep '^AZURACAST_VERSION=' .env"
        chdir: "{{ azuracast_dir }}"
      register: env_check

    - name: "4f. Abortar si AZURACAST_VERSION no quedó como el tag deseado"
      ansible.builtin.fail:
        msg: "AZURACAST_VERSION en .env no quedó como {{ image_tag }}. Revisa el archivo a mano."
      when: env_check.stdout | trim != "AZURACAST_VERSION={{ image_tag }}"

    - name: "5. Eliminar el servicio updater (Watchtower) del docker-compose.yml"
      ansible.builtin.replace:
        path: "{{ azuracast_dir }}/docker-compose.yml"
        regexp: '(?ms)\n  updater:\n.*?(?=\nvolumes:)'
        replace: '\n'
      register: updater_removed
      changed_when: updater_removed.changed

    - name: "5b. Detener el contenedor updater si sigue corriendo"
      ansible.builtin.command:
        cmd: "docker rm -f azuracast_updater"
        changed_when: false
        failed_when: false
        ignore_errors: yes

    - name: "6. Descargar la imagen nueva (docker compose pull)"
      ansible.builtin.command:
        cmd: "docker compose pull"
        chdir: "{{ azuracast_dir }}"
      register: pull_result
      changed_when: pull_result.rc == 0

    - name: "7. Recrear el contenedor (docker compose up -d)"
      ansible.builtin.command:
        cmd: "docker compose up -d"
        chdir: "{{ azuracast_dir }}"
      register: up_result
      changed_when: up_result.rc == 0

    - name: "8. Esperar a que el contenedor arranque"
      ansible.builtin.pause:
        seconds: 15

    - name: "9. Verificar que el panel responde"
      ansible.builtin.uri:
        url: "http://localhost/api/status"
        status_code: 200
        timeout: 30
      register: health
      retries: 5
      delay: 10
      until: health.status == 200
      ignore_errors: yes

    - name: "10. Mostrar resultado final"
      ansible.builtin.debug:
        msg: |
          ✅ Despliegue completado en {{ inventory_hostname }}
          - Backup: /var/azuracast/backups/{{ backup_name }}
          - Imagen: {{ image_name }}:{{ image_tag }}
          - AZURACAST_VERSION alineado: AZURACAST_VERSION={{ image_tag }} ({{ env_change.changed | ternary('actualizado', 'ya estaba') }})
          - Updater (Watchtower): {{ 'eliminado' if updater_removed.changed else 'no estaba presente' }}
          - Panel: {{ 'respondiendo OK' if health.status == 200 else 'NO responde aún (revisa docker logs azuracast)' }}