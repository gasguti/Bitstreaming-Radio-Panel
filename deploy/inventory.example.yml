# Inventario de servidores Bitstreaming Radio Panel (PLANTILLA)
# =============================================================
# ⚠️ NO edites este archivo con datos reales.
# Copia este archivo a "inventory.local.yml" y pon ahí tus datos reales.
# "inventory.local.yml" está ignorado por git (no se sube al repo público).
#
# Uso:
#   cp inventory.example.yml inventory.local.yml
#   # edita inventory.local.yml con tus datos reales
#   ansible-playbook -i inventory.local.yml deploy.yml

all:
  hosts:
    azura1:
      ansible_host: azura1.bitstreaming.net
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      # Ruta de instalación de AzuraCast en el servidor
      azuracast_dir: /var/azuracast
      # Imagen Docker del fork (NO cambiar salvo que cambie el nombre del repo)
      image_name: ghcr.io/gasguti/bitstreaming-radio-panel
      image_tag: latest

